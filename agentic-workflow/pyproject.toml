[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_workflow"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "copilot-mcp-agentic-workflow"
version = "1.0.0"
description = "GitHub Copilot SDK + MCP Protocol を活用した Agentic Workflow デモ"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Takuya Niita" }
]
dependencies = [
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
copilot = [
    "github-copilot-sdk @ git+https://github.com/github/copilot-sdk.git#subdirectory=python",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
agentic-demo = "agentic_workflow.main:main"
weather-agent = "agentic_workflow.demos.weather_agent:main"
multi-agent = "agentic_workflow.demos.multi_tool_agent:main"
multi-model = "agentic_workflow.demos.multi_model_agent:main_sync"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
